{{- /* Anchor list for the sidebar. Items: dicts with id, title, level, count. */ -}}
{{- with . -}}
<ol class="nk-side-list">
  {{- range . }}
  <li class="nk-l{{ .level | default 2 }}"><a href="#{{ .id }}"><span>{{ .title }}</span>{{ with .count }}<span class="nk-count">{{ . }}</span>{{ end }}</a></li>
  {{- end }}
</ol>
{{- end -}}
