title: Prof. Nikolaos Korfiatis
baseURL: https://nkorf.github.io/
defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true
cascade:
- target:
    path: /slides/**
    kind: page
  outputs:
  - HTML
  - present
- params:
    reading_time: false
    share: false
build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles:
- .ipynb_checkpoints$
- \.Rmd$
- \.Rmarkdown$
- _cache$
disableAliases: false
outputs:
  home:
  - HTML
  - RSS
  - headers
  - redirects
  - backlinks
  section:
  - HTML
  - RSS
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    allow:
    - ^(dart-)?sass$
    - ^go$
    - ^git$
    - ^node$
    - ^postcss$
    - ^tailwindcss$
sitemap:
  _merge: deep
